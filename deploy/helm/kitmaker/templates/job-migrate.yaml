{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kitmaker.fullname" . }}-migrate
  labels:
    {{- include "kitmaker.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Migrations are expand/contract, so the old pods keep working while the
    # schema moves ahead of them (DESIGN.md §11.6).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "kitmaker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # The chart's ServiceAccount doesn't exist yet on first install, and
      # migrate needs only the database.
      serviceAccountName: default
      automountServiceAccountToken: false
      {{- include "kitmaker.podSpecCommon" . | nindent 6 }}
      containers:
        - name: migrate
          args: ["migrate"]
          {{- include "kitmaker.containerCommon" . | nindent 10 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
