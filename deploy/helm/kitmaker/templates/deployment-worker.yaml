apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kitmaker.fullname" . }}-worker
  labels:
    {{- include "kitmaker.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "kitmaker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "kitmaker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kitmaker.serviceAccountName" . }}
      # River elects a leader for periodic jobs, so any replica count is safe.
      terminationGracePeriodSeconds: 60
      {{- include "kitmaker.podSpecCommon" . | nindent 6 }}
      containers:
        - name: worker
          args: ["worker"]
          {{- include "kitmaker.containerCommon" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
