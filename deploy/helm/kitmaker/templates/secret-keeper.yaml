{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitmaker.secretsSecretName" . }}
  labels:
    {{- include "kitmaker.labels" . | nindent 4 }}
  annotations:
    # Keep the key across uninstalls: losing it makes stored integration
    # secrets unreadable.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{ .Values.secrets.existingSecretKey }}: {{ required "secrets.url or secrets.existingSecret is required" .Values.secrets.url | quote }}
{{- end }}
