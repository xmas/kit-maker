{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitmaker.databaseSecretName" . }}
  labels:
    {{- include "kitmaker.labels" . | nindent 4 }}
  annotations:
    # The migrate hook runs before regular resources exist, so the Secret it
    # reads is a hook too, created first.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ required "database.url or database.existingSecret is required" .Values.database.url | quote }}
{{- end }}
