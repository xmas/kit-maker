# Kit Maker, Cloudflare edition: a Pages project (static site + Functions)
# with one D1 database. See README.md in this folder.
name = "kitmaker"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

# Settings are Pages secrets (wrangler pages secret put NAME), not vars:
#   JWT_SECRET         signs the session cookie (any long random string)
#   RESEND_API_KEY     sends sign-in codes and links (resend.com)
#   MAIL_FROM          their sender, e.g. Kit Maker <login@ezdata.xyz>
#   ALLOWED_EMAILS     optional: addresses and @domains that may sign in
#                      (unset: any verified email)
#   GUEST_PASSPHRASE   optional: a shared passphrase that signs in as Guest
#   ANTHROPIC_API_KEY  optional: turns on AI search, Explain and drafts
#   PUBLISH_GITHUB_REPO   owner/repo whose publish-kit workflow builds kits
#   PUBLISH_GITHUB_TOKEN  fine-grained token: Actions read and write on it
#   PUBLISH_GITHUB_REF    optional: branch to run it from (default main)
#   PUBLISH_REGISTRY      optional: default ghcr.io/<owner>
# Locally they come from .dev.vars (git-ignored).

[[d1_databases]]
binding = "DB"
database_name = "kitmaker"
# From npx wrangler d1 create kitmaker (an id, not a secret).
database_id = "e13fe60e-a91c-407e-b49c-cb710bf04967"
migrations_dir = "migrations"
